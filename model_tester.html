<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BabylonJS Model Test</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>

    <!-- BabylonJS Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- glTF Loader -->
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- Inspector -->
    <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script>
  </head>

  <body>
    <canvas id="renderCanvas"></canvas>

    <script>
      B64Assets = {};
    </script>

    <!--LINK MODEL HERE-->
    <script src="./dist/models-patrick_test.glb.js"></script>
    <!--LINK MODEL HERE-->

    <script src="./dist/textures-checkerboard.jpeg.js"></script>
    <script>
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true);
      const scene = new BABYLON.Scene(engine);

      const camera = new BABYLON.ArcRotateCamera(
        "arcCam",
        Math.PI / 2,
        Math.PI / 2.5,
        5,
        BABYLON.Vector3.Zero(),
        scene
      );
      camera.attachControl(canvas, true);

      const light = new BABYLON.HemisphericLight(
        "light",
        new BABYLON.Vector3(0, 1, 0),
        scene
      );

      const ground = BABYLON.MeshBuilder.CreateGround(
        "ground",
        {
          width: 10,
          height: 10,
          subdivisions: 1,
        },
        scene
      );

      ground.position.y = 0; // Flat at Y = 0 (Z is forward/backward axis)

      const groundMaterial = new BABYLON.StandardMaterial("groundMat", scene);
      const texture = new BABYLON.Texture(
        B64Assets["textures-checkerboard.jpeg"],
        scene
      );
      texture.uScale = 5; // Repeat texture so each tile is 1x1
      texture.vScale = 5;

      groundMaterial.diffuseTexture = texture;
      ground.material = groundMaterial;

      // Enable debug layer
      scene.debugLayer.show();

      // Safely check and load model from B64Assets
      if (typeof B64Assets !== "object") {
        throw new Error("B64Assets is not defined.");
      }

      const modelKey = Object.keys(B64Assets).find((k) => k.endsWith(".glb"));
      if (!modelKey) {
        throw new Error("No .glb model found in B64Assets.");
      }

      fetch(B64Assets[modelKey])
        .then((res) => res.blob())
        .then((blob) => {
          const file = new File([blob], modelKey, {
            type: "model/gltf-binary",
          });
          BABYLON.SceneLoader.ImportMeshAsync("", "", file, scene)
            .then(() => console.log("✅ Model loaded:", modelKey))
            .catch((err) => console.error("❌ Failed to load model:", err));
        });

      engine.runRenderLoop(() => scene.render());
      window.addEventListener("resize", () => engine.resize());
    </script>
  </body>
</html>
